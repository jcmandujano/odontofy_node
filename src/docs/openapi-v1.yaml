  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    EvolutionNoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TreatmentPlanId:
      name: treatmentPlanId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    TreatmentPlanItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    BillingConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    BillingRecordId:
      name: billingRecordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
  headers:
    RequestId:
      description: Identificador de correlacion de la solicitud.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    BaseResponse:
      type: object
      required: [success, message, data, errors, requestId]
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        errors:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ErrorItem'
            - type: 'null'
        requestId:
          type: string
        meta:
          type: object
          additionalProperties: true
    ErrorItem:
      type: object
      required: [code, details]
      properties:
        code:
          type: string
        details: {}
      additionalProperties: false
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: false
            data:
              type: 'null'
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ErrorItem'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
      additionalProperties: false
    RegisterRequest:
      type: object
      required: [name, lastName, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
          default: ''
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
          maxLength: 30
          default: ''
        avatar:
          type: string
          maxLength: 2048
          default: ''
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
      additionalProperties: false
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      additionalProperties: false
    AccountVerificationRequest:
      type: object
      required: [userId, token]
      properties:
        userId:
          type: integer
          minimum: 1
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        password:
          type: string
          minLength: 12
          maxLength: 72
      additionalProperties: false
    VerifyPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
      additionalProperties: false
    PatientWriteFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          oneOf:
            - type: string
              maxLength: 100
            - type: 'null'
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        gender:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: '^[0-9+(). -]*$'
            - type: 'null'
        maritalStatus:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
        occupation:
          oneOf:
            - type: string
              maxLength: 150
            - type: 'null'
        address:
          oneOf:
            - type: string
              maxLength: 10000
            - type: 'null'
        emergencyContactName:
          oneOf:
            - type: string
              maxLength: 200
            - type: 'null'
        emergencyContactPhone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: '^[0-9+(). -]*$'
            - type: 'null'
        emergencyContactRelationship:
          oneOf:
            - type: string
              maxLength: 100
            - type: 'null'
        reasonForConsultation:
          oneOf:
            - type: string
              maxLength: 10000
            - type: 'null'
        rfc:
          oneOf:
            - type: string
              pattern: '^[A-Z&\u00d1]{3,4}\d{6}[A-Z0-9]{3}$'
            - type: 'null'
        email:
          oneOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
    CreatePatientRequest:
