        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/PublicUser'
            errors:
              type: 'null'
    EmptySuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: 'null'
            errors:
              type: 'null'
    PasswordVerifiedResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: object
              required: [valid]
              properties:
                valid:
                  const: true
              additionalProperties: false
            errors:
              type: 'null'
    VersionResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: object
              required: [version]
              properties:
                version:
                  const: v1
              additionalProperties: false
            errors:
              type: 'null'
    LivenessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: object
              required: [status]
              properties:
                status:
                  const: ok
              additionalProperties: false
            errors:
              type: 'null'
    ReadinessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: object
              required: [status]
              properties:
                status:
                  const: ready
              additionalProperties: false
            errors:
              type: 'null'
    BillingMoney:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      examples: ['1250.00']
    SignedBillingMoney:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      examples: ['-50.00', '1250.00']
    BillingAggregateMoney:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['1250.00', '19999999999.98']
    BillingPaymentMethod:
      type: string
      enum: [CASH, DEBIT_CARD, CREDIT_CARD, BANK_TRANSFER, OTHER, MIXED]
    CreateBillingConceptRequest:
      type: object
      required: [description, unitPrice]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        unitPrice:
          $ref: '#/components/schemas/BillingMoney'
      additionalProperties: false
    UpdateBillingConceptRequest:
      type: object
      minProperties: 1
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        unitPrice:
          $ref: '#/components/schemas/BillingMoney'
      additionalProperties: false
    BillingConcept:
      type: object
      required: [id, description, unitPrice, active, createdAt, updatedAt]
      properties:
        id:
          type: integer
        description:
          type: string
        unitPrice:
          $ref: '#/components/schemas/BillingMoney'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    BillingRecordItemRequest:
      type: object
      required: [conceptId, quantity]
      properties:
        conceptId:
          type: integer
          minimum: 1
          maximum: 4294967295
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
      additionalProperties: false
    CreateBillingRecordRequest:
      type: object
      required: [occurredOn, items]
      properties:
        occurredOn:
          type: string
          format: date
        discount:
          $ref: '#/components/schemas/BillingMoney'
        amountReceived:
          $ref: '#/components/schemas/BillingMoney'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/BillingPaymentMethod'
            - type: 'null'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BillingRecordItemRequest'
      additionalProperties: false
    CorrectBillingRecordRequest:
      type: object
      required: [occurredOn, items, changeReason]
      properties:
        occurredOn:
          type: string
          format: date
        discount:
          $ref: '#/components/schemas/BillingMoney'
        amountReceived:
          $ref: '#/components/schemas/BillingMoney'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/BillingPaymentMethod'
            - type: 'null'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BillingRecordItemRequest'
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    CancelBillingRecordRequest:
      type: object
      required: [changeReason]
      properties:
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    BillingItem:
      type: object
      required: [id, billingRecordId, conceptId, description, unitPrice, quantity, subtotal]
      properties:
        id:
          type: integer
        billingRecordId:
          type: integer
        conceptId:
          type: integer
        description:
          type: string
        unitPrice:
          $ref: '#/components/schemas/BillingMoney'
        quantity:
          type: integer
        subtotal:
          $ref: '#/components/schemas/BillingMoney'
      additionalProperties: false
    BillingActor:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: integer
        name:
          type: string
      additionalProperties: false
    BillingRecord:
      type: object
      required:
        - id
        - patientId
        - occurredOn
        - subtotal
        - discount
        - total
        - amountReceived
        - balanceChange
        - balanceAfter
        - paymentMethod
        - status
        - version
        - author
        - cancelledAt
        - cancelledBy
        - cancellationReason
        - items
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        patientId:
          type: integer
        occurredOn:
          type: string
          format: date
        subtotal:
          $ref: '#/components/schemas/BillingMoney'
        discount:
          $ref: '#/components/schemas/BillingMoney'
        total:
          $ref: '#/components/schemas/BillingMoney'
        amountReceived:
          $ref: '#/components/schemas/BillingMoney'
        balanceChange:
          $ref: '#/components/schemas/SignedBillingMoney'
        balanceAfter:
          $ref: '#/components/schemas/SignedBillingMoney'
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/BillingPaymentMethod'
            - type: 'null'
        status:
          type: string
          enum: [POSTED, CANCELLED]
        version:
          type: integer
          minimum: 1
        author:
          $ref: '#/components/schemas/BillingActor'
        cancelledAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        cancelledBy:
          oneOf:
            - type: object
              required: [userId]
              properties:
                userId:
                  type: integer
              additionalProperties: false
            - type: 'null'
        cancellationReason:
          oneOf:
            - type: string
            - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    BillingRevision:
      allOf:
        - $ref: '#/components/schemas/BillingRecord'
        - type: object
          required: [revisionId, action, changedBy, changeReason, recordedAt]
          properties:
            revisionId:
              type: integer
            action:
              type: string
              enum: [CREATED, CORRECTED, CANCELLED]
            changedBy:
              $ref: '#/components/schemas/BillingActor'
            changeReason:
              oneOf:
                - type: string
                - type: 'null'
            recordedAt:
              type: string
              format: date-time
    BillingSummary:
      type: object
      required: [totalBilled, totalReceived, totalDiscount, netChange, currentBalance]
      properties:
        totalBilled:
          $ref: '#/components/schemas/BillingAggregateMoney'
        totalReceived:
          $ref: '#/components/schemas/BillingAggregateMoney'
        totalDiscount:
          $ref: '#/components/schemas/BillingAggregateMoney'
        netChange:
          $ref: '#/components/schemas/BillingAggregateMoney'
        currentBalance:
          $ref: '#/components/schemas/BillingAggregateMoney'
      additionalProperties: false
    BillingConceptResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/BillingConcept'
            errors:
              type: 'null'
    BillingConceptListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/BillingConcept'
            errors:
              type: 'null'
    BillingRecordResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/BillingRecord'
            errors:
              type: 'null'
    BillingRecordListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/BillingRecord'
            errors:
              type: 'null'
    BillingRevisionListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/BillingRevision'
            errors:
              type: 'null'
    BillingSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/BillingSummary'
            errors:
              type: 'null'
