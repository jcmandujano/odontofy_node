components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: odontofy_refresh_v1
  responses:
    SessionCreated:
      description: Sesion autenticada.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Cookie refresh HttpOnly y SameSite Strict.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    UserProfile:
      description: Perfil seguro del usuario actual.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
    EmptySuccess:
      description: Operacion completada.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccessResponse'
    Accepted:
      description: Solicitud aceptada con respuesta anti-enumeracion.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccessResponse'
    InvalidRequest:
      description: Payload o token de accion invalido.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales o sesion no validas.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite de solicitudes excedido.
      headers:
        X-Request-Id:
