openapi: 3.1.1
info:
  title: Odontofy API
  version: 1.0.0
  description: Contrato de la API v1 de Odontofy.
servers:
  - url: /api/v1
tags:
  - name: Platform
    description: Estado y metadatos de la plataforma HTTP.
  - name: Identity
    description: Autenticacion, ciclo de cuenta y perfil del usuario actual.
  - name: Patients
    description: Pacientes propiedad del usuario autenticado.
  - name: Treatment Plans
    description: Planes de tratamiento e items propiedad del usuario autenticado.
  - name: Clinical Records
    description: Historial medico y notas clinicas versionadas de pacientes propios.
  - name: Billing
    description: Catalogos y registros financieros internos; no emite CFDI ni procesa tarjetas.
paths:
  /:
    get:
      operationId: getApiVersion
      tags: [Platform]
      summary: Obtiene la version activa de la API.
      responses:
        '200':
          description: Version activa.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      summary: Confirma que el proceso HTTP esta activo.
      responses:
        '200':
          description: Proceso activo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Confirma que las dependencias necesarias estan disponibles.
      responses:
        '200':
          description: Servicio listo para recibir trafico.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Una dependencia requerida no esta disponible.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: login
      tags: [Identity]
      summary: Inicia una sesion y crea una cookie refresh protegida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      summary: Rota la sesion refresh y emite un access token nuevo.
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      summary: Revoca la sesion refresh actual y elimina su cookie.
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /auth/register:
    post:
      operationId: register
      tags: [Identity]
      summary: Solicita el registro de una cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/account-verification/request:
    post:
      operationId: requestAccountVerification
      tags: [Identity]
      summary: Solicita instrucciones de activacion sin revelar la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/account-verification/confirm:
    post:
      operationId: confirmAccount
      tags: [Identity]
      summary: Consume un token de activacion de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Identity]
      summary: Solicita recuperacion sin revelar si la cuenta existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Identity]
      summary: Cambia la contrasena con un token de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/verify:
    post:
      operationId: verifyPassword
      tags: [Identity]
      summary: Reautentica al usuario para una operacion sensible.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequest'
      responses:
        '200':
          description: Contrasena verificada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordVerifiedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      summary: Obtiene el perfil autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentUser
      tags: [Identity]
      summary: Actualiza campos permitidos del perfil autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients:
    get:
      operationId: listPatients
      tags: [Patients]
      summary: Lista pacientes del usuario autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ''
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
      responses:
        '200':
          $ref: '#/components/responses/PatientList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPatient
      tags: [Patients]
      summary: Crea un paciente para el usuario autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
    get:
      operationId: getPatient
      tags: [Patients]
      summary: Obtiene un paciente propio por ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
    patch:
      operationId: updatePatient
      tags: [Patients]
      summary: Actualiza campos permitidos o restaura un paciente propio.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
    delete:
      operationId: archivePatient
      tags: [Patients]
      summary: Archiva un paciente propio sin borrar sus relaciones.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
  /patients/{patientId}/treatment-plans:
    parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
    get:
      operationId: listTreatmentPlans
      tags: [Treatment Plans]
      summary: Lista planes propios de un paciente propio.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/TreatmentPlanStatus'
              - const: all
            default: all
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
    post:
      operationId: createTreatmentPlan
      tags: [Treatment Plans]
      summary: Crea un plan borrador para un paciente propio.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTreatmentPlanRequest'
      responses:
        '201':
          $ref: '#/components/responses/TreatmentPlanResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
  /treatment-plans/{treatmentPlanId}:
    parameters:
      - $ref: '#/components/parameters/TreatmentPlanId'
    get:
      operationId: getTreatmentPlan
      tags: [Treatment Plans]
      summary: Obtiene un plan propio con sus items, sin notas de evolucion.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
    patch:
      operationId: updateTreatmentPlan
      tags: [Treatment Plans]
      summary: Actualiza campos permitidos y recalcula importes si corresponde.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTreatmentPlanRequest'
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
    delete:
      operationId: cancelTreatmentPlan
      tags: [Treatment Plans]
      summary: Cancela un plan propio de forma idempotente y conserva sus items.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
  /treatment-plans/{treatmentPlanId}/status:
    parameters:
      - $ref: '#/components/parameters/TreatmentPlanId'
    patch:
      operationId: updateTreatmentPlanStatus
      tags: [Treatment Plans]
      summary: Cambia el estado de un plan y mantiene sus timestamps de negocio.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTreatmentPlanStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
  /treatment-plans/{treatmentPlanId}/items:
    parameters:
      - $ref: '#/components/parameters/TreatmentPlanId'
    post:
      operationId: createTreatmentPlanItem
      tags: [Treatment Plans]
      summary: Agrega un item y recalcula el plan en una transaccion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTreatmentPlanItemRequest'
      responses:
        '201':
          $ref: '#/components/responses/TreatmentPlanItemMutation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
  /treatment-plans/{treatmentPlanId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TreatmentPlanId'
      - $ref: '#/components/parameters/TreatmentPlanItemId'
    patch:
      operationId: updateTreatmentPlanItem
      tags: [Treatment Plans]
      summary: Actualiza un item y recalcula el plan en una transaccion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTreatmentPlanItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanItemMutation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
    delete:
      operationId: cancelTreatmentPlanItem
      tags: [Treatment Plans]
      summary: Cancela un item de forma idempotente y recalcula el plan.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanItemMutation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
  /treatment-plans/{treatmentPlanId}/items/{itemId}/status:
    parameters:
      - $ref: '#/components/parameters/TreatmentPlanId'
      - $ref: '#/components/parameters/TreatmentPlanItemId'
    patch:
      operationId: updateTreatmentPlanItemStatus
      tags: [Treatment Plans]
      summary: Cambia el estado de un item y mantiene completedAt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTreatmentPlanItemStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/TreatmentPlanItemMutation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TreatmentPlanNotFound'
        '409':
          $ref: '#/components/responses/TreatmentPlanConflict'
  /patients/{patientId}/medical-history:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      operationId: getMedicalHistory
      tags: [Clinical Records]
      summary: Obtiene el snapshot actual del historial medico estructurado.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MedicalHistoryResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
    put:
      operationId: updateMedicalHistory
      tags: [Clinical Records]
      summary: Reemplaza el snapshot y agrega una revision inmutable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicalHistoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/MedicalHistoryResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
  /patients/{patientId}/medical-history/revisions:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      operationId: listMedicalHistoryRevisions
      tags: [Clinical Records]
      summary: Lista revisiones inmutables del historial medico.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/MedicalHistoryRevisionList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
  /patients/{patientId}/evolution-notes:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      operationId: listEvolutionNotes
      tags: [Clinical Records]
      summary: Lista notas clinicas propias con filtros y paginacion acotada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ''
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: treatmentPlanId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 4294967295
        - name: treatmentPlanItemId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 4294967295
      responses:
        '200':
          $ref: '#/components/responses/EvolutionNoteList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
    post:
      operationId: createEvolutionNote
      tags: [Clinical Records]
      summary: Crea una nota y opcionalmente completa su item en una transaccion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvolutionNoteRequest'
      responses:
        '201':
          $ref: '#/components/responses/EvolutionNoteResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
        '409':
          $ref: '#/components/responses/ClinicalRecordConflict'
  /patients/{patientId}/evolution-notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
      - $ref: '#/components/parameters/EvolutionNoteId'
    get:
      operationId: getEvolutionNote
      tags: [Clinical Records]
      summary: Obtiene una nota propia por ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EvolutionNoteResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
    patch:
      operationId: updateEvolutionNote
      tags: [Clinical Records]
      summary: Corrige una nota activa y agrega una revision inmutable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEvolutionNoteRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvolutionNoteResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
        '409':
          $ref: '#/components/responses/ClinicalRecordConflict'
    delete:
      operationId: archiveEvolutionNote
      tags: [Clinical Records]
      summary: Archiva una nota de forma idempotente sin borrado fisico.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalRecordLifecycleRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvolutionNoteResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
  /patients/{patientId}/evolution-notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/PatientId'
      - $ref: '#/components/parameters/EvolutionNoteId'
    post:
      operationId: restoreEvolutionNote
      tags: [Clinical Records]
      summary: Restaura una nota archivada de forma idempotente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalRecordLifecycleRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvolutionNoteResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClinicalRecordNotFound'
  /patients/{patientId}/evolution-notes/{noteId}/revisions:
    parameters:
