openapi: 3.1.1
info:
  title: Odontofy API
  version: 1.0.0
  description: Contrato de la API v1 de Odontofy.
servers:
  - url: /api/v1
tags:
  - name: Platform
    description: Estado y metadatos de la plataforma HTTP.
  - name: Identity
    description: Autenticacion, ciclo de cuenta y perfil del usuario actual.
  - name: Patients
    description: Pacientes propiedad del usuario autenticado.
paths:
  /:
    get:
      operationId: getApiVersion
      tags: [Platform]
      summary: Obtiene la version activa de la API.
      responses:
        '200':
          description: Version activa.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      summary: Confirma que el proceso HTTP esta activo.
      responses:
        '200':
          description: Proceso activo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Confirma que las dependencias necesarias estan disponibles.
      responses:
        '200':
          description: Servicio listo para recibir trafico.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Una dependencia requerida no esta disponible.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: login
      tags: [Identity]
      summary: Inicia una sesion y crea una cookie refresh protegida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      summary: Rota la sesion refresh y emite un access token nuevo.
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      summary: Revoca la sesion refresh actual y elimina su cookie.
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /auth/register:
    post:
      operationId: register
      tags: [Identity]
      summary: Solicita el registro de una cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/account-verification/request:
    post:
      operationId: requestAccountVerification
      tags: [Identity]
      summary: Solicita instrucciones de activacion sin revelar la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/account-verification/confirm:
    post:
      operationId: confirmAccount
      tags: [Identity]
      summary: Consume un token de activacion de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Identity]
      summary: Solicita recuperacion sin revelar si la cuenta existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Identity]
      summary: Cambia la contrasena con un token de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/verify:
    post:
      operationId: verifyPassword
      tags: [Identity]
      summary: Reautentica al usuario para una operacion sensible.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequest'
      responses:
        '200':
          description: Contrasena verificada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordVerifiedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      summary: Obtiene el perfil autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentUser
      tags: [Identity]
      summary: Actualiza campos permitidos del perfil autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients:
    get:
      operationId: listPatients
      tags: [Patients]
      summary: Lista pacientes del usuario autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ''
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
      responses:
        '200':
          $ref: '#/components/responses/PatientList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPatient
      tags: [Patients]
      summary: Crea un paciente para el usuario autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
    get:
      operationId: getPatient
      tags: [Patients]
      summary: Obtiene un paciente propio por ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
    patch:
      operationId: updatePatient
      tags: [Patients]
      summary: Actualiza campos permitidos o restaura un paciente propio.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          $ref: '#/components/responses/PatientResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
    delete:
      operationId: archivePatient
      tags: [Patients]
      summary: Archiva un paciente propio sin borrar sus relaciones.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatientNotFound'
  /openapi.json:
    get:
      operationId: getOpenApiContract
      tags: [Platform]
      summary: Obtiene el contrato OpenAPI v1 sin envelope.
      responses:
        '200':
          description: Documento OpenAPI 3.1.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: odontofy_refresh_v1
  responses:
    SessionCreated:
      description: Sesion autenticada.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Cookie refresh HttpOnly y SameSite Strict.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    UserProfile:
      description: Perfil seguro del usuario actual.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
    EmptySuccess:
      description: Operacion completada.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccessResponse'
    Accepted:
      description: Solicitud aceptada con respuesta anti-enumeracion.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccessResponse'
    InvalidRequest:
      description: Payload o token de accion invalido.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales o sesion no validas.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite de solicitudes excedido.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PatientResource:
      description: Paciente del usuario autenticado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatientResponse'
    PatientList:
      description: Pagina de pacientes propios.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatientListResponse'
    PatientNotFound:
      description: El paciente no existe o pertenece a otro usuario.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    RequestId:
      description: Identificador de correlacion de la solicitud.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    BaseResponse:
      type: object
      required: [success, message, data, errors, requestId]
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        errors:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ErrorItem'
            - type: 'null'
        requestId:
          type: string
        meta:
          type: object
          additionalProperties: true
    ErrorItem:
      type: object
      required: [code, details]
      properties:
        code:
          type: string
        details: {}
      additionalProperties: false
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: false
            data:
              type: 'null'
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ErrorItem'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
      additionalProperties: false
    RegisterRequest:
      type: object
      required: [name, lastName, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
          default: ''
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
          maxLength: 30
          default: ''
        avatar:
          type: string
          maxLength: 2048
          default: ''
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
      additionalProperties: false
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      additionalProperties: false
    AccountVerificationRequest:
      type: object
      required: [userId, token]
      properties:
        userId:
          type: integer
          minimum: 1
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        password:
          type: string
          minLength: 12
          maxLength: 72
      additionalProperties: false
    VerifyPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
      additionalProperties: false
    PatientWriteFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          oneOf:
            - type: string
              maxLength: 100
            - type: 'null'
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        gender:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: '^[0-9+(). -]*$'
            - type: 'null'
        maritalStatus:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
        occupation:
          oneOf:
            - type: string
              maxLength: 150
            - type: 'null'
        address:
          oneOf:
            - type: string
              maxLength: 10000
            - type: 'null'
        emergencyContactName:
          oneOf:
            - type: string
              maxLength: 200
            - type: 'null'
        emergencyContactPhone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: '^[0-9+(). -]*$'
            - type: 'null'
        emergencyContactRelationship:
          oneOf:
            - type: string
              maxLength: 100
            - type: 'null'
        reasonForConsultation:
          oneOf:
            - type: string
              maxLength: 10000
            - type: 'null'
        rfc:
          oneOf:
            - type: string
              pattern: '^[A-Z&\u00d1]{3,4}\d{6}[A-Z0-9]{3}$'
            - type: 'null'
        familyMedicalHistory:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        personalMedicalHistory:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        email:
          oneOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
    CreatePatientRequest:
      allOf:
        - $ref: '#/components/schemas/PatientWriteFields'
      required: [name, lastName]
      unevaluatedProperties: false
    UpdatePatientRequest:
      allOf:
        - $ref: '#/components/schemas/PatientWriteFields'
        - type: object
          properties:
            active:
              type: boolean
      minProperties: 1
      unevaluatedProperties: false
    PublicPatient:
      type: object
      required:
        - id
        - name
        - middleName
        - lastName
        - gender
        - dateOfBirth
        - phone
        - maritalStatus
        - occupation
        - address
        - emergencyContactName
        - emergencyContactPhone
        - emergencyContactRelationship
        - reasonForConsultation
        - rfc
        - familyMedicalHistory
        - personalMedicalHistory
        - email
        - active
        - currentBalance
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        middleName:
          oneOf:
            - type: string
            - type: 'null'
        lastName:
          type: string
        gender:
          oneOf:
            - type: string
            - type: 'null'
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          oneOf:
            - type: string
            - type: 'null'
        maritalStatus:
          oneOf:
            - type: string
            - type: 'null'
        occupation:
          oneOf:
            - type: string
            - type: 'null'
        address:
          oneOf:
            - type: string
            - type: 'null'
        emergencyContactName:
          oneOf:
            - type: string
            - type: 'null'
        emergencyContactPhone:
          oneOf:
            - type: string
            - type: 'null'
        emergencyContactRelationship:
          oneOf:
            - type: string
            - type: 'null'
        reasonForConsultation:
          oneOf:
            - type: string
            - type: 'null'
        rfc:
          oneOf:
            - type: string
            - type: 'null'
        familyMedicalHistory:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        personalMedicalHistory:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        email:
          oneOf:
            - type: string
              format: email
            - type: 'null'
        active:
          type: boolean
        currentBalance:
          type: string
          pattern: '^-?\d{1,10}\.\d{2}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    PublicPatientSummary:
      type: object
      required:
        - id
        - name
        - middleName
        - lastName
        - dateOfBirth
        - phone
        - email
        - active
        - currentBalance
        - createdAt
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        middleName:
          oneOf:
            - type: string
            - type: 'null'
        lastName:
          type: string
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          oneOf:
            - type: string
            - type: 'null'
        email:
          oneOf:
            - type: string
              format: email
            - type: 'null'
        active:
          type: boolean
        currentBalance:
          type: string
          pattern: '^-?\d{1,10}\.\d{2}$'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
    PatientResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/PublicPatient'
            errors:
              type: 'null'
    PatientListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/PublicPatientSummary'
            errors:
              type: 'null'
            meta:
              type: object
              required: [pagination]
              properties:
                pagination:
                  $ref: '#/components/schemas/PaginationMeta'
              additionalProperties: false
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          type: string
          maxLength: 30
        avatar:
          type: string
          maxLength: 2048
      additionalProperties: false
    PublicUser:
      type: object
      required:
        - id
        - name
        - middleName
        - lastName
        - dateOfBirth
        - phone
        - avatar
        - email
        - showFinanceStats
        - isGoogleSynced
      properties:
        id:
          type: integer
        name:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        phone:
          type: string
        avatar:
          type: string
        email:
          type: string
          format: email
        showFinanceStats:
          type: boolean
        isGoogleSynced:
          type: boolean
      additionalProperties: false
    SessionData:
      type: object
      required: [accessToken, user]
      properties:
