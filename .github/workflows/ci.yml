name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Angular consumer
        uses: actions/checkout@v4
        with:
          repository: jcmandujano/odontofy_UI
          path: contract-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Match Angular calls against OpenAPI
        run: npm run contract:angular -- contract-ui

      - name: Audit production dependencies
        run: npm run security:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: odontofy_test
          MYSQL_USER: odontofy_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uodontofy_ci -pci-password --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      NODE_ENV: test
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_DATABASE: odontofy_test
      MYSQL_TEST_USER: odontofy_ci
      MYSQL_TEST_PASSWORD: ci-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations and database integrity
        run: npm run db:verify:test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
